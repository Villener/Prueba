<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- El icono lo pone main.jsx desde src/assets/logo.svg, para que el logo
         de la pantalla y el de la pestaña salgan del mismo archivo. -->
    <!-- Azul acero de la identidad, no un gris genérico: es el color de la
         barra del navegador en el teléfono, que es donde más se ve. -->
    <meta name="theme-color" content="#0E5F8F" />
    <!-- App instalable (PWA): nombre, iconos y como abre. El iPhone no lee el
         manifest para el icono ni acepta SVG: necesita su PNG cuadrado. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taller BG" />
    <title>Baja Gas · Flota y Taller</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

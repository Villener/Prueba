server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # La API se sirve por el MISMO origen que la pantalla, y esa es la decision
    # que hace que esto funcione desde un telefono sin tocar el codigo:
    #
    # frontend/src/core/api.js pide `/api/...` en relativo, y main.py solo
    # permite CORS desde localhost:5173. Si el telefono llamara directo a
    # http://<ip>:8000 el navegador bloquearia cada peticion. Pasando por aqui
    # no hay peticion cruzada que bloquear: para el navegador todo es el mismo
    # servidor.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # El recalculo de la agenda sobre 30 dias no siempre contesta rapido.
        proxy_read_timeout 120s;
    }

    # La pantalla usa HashRouter, asi que las rutas viven detras de "#/" y
    # nunca llegan al servidor. El fallback queda igual por si alguien teclea
    # una ruta a mano o se migra a BrowserRouter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite traen hash en el nombre: se pueden cachear para
    # siempre. El index.html no, o el telefono se quedaria con la version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/css application/javascript image/svg+xml application/json;
}
